<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./src/client/style.css" />
    <style>
      body { padding: 30px; }
      .preview { display: flex; gap: 28px; align-items: flex-start; }
      .players-panel { max-height: none; width: 172px; }
    </style>
  </head>
  <body>
    <div id="app"><div class="preview">
      <div class="players-panel">
        <div class="player-chip self has-streak streak-warm" style="--streak:2">
          <span class="streak-flare"><i></i><i></i><i></i><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><s></s><s></s><s></s><s></s></span>
          <div class="chip-head"><span class="chip-rank">1</span><span class="chip-name">Странник</span><span class="chip-lives">28<small>/30</small></span></div>
          <div class="chip-hp"><span class="chip-hp-fill" style="width:93.3%"></span></div>
          <div class="chip-foot"><span class="chip-streak"><b>2</b><s></s><s></s><s></s><s></s></span><span class="chip-meta">ур. 5</span></div>
        </div>
        <div class="player-chip has-streak streak-hot" style="--streak:4">
          <span class="streak-flare"><i></i><i></i><i></i><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><s></s><s></s><s></s><s></s></span>
          <div class="chip-head"><span class="chip-rank">2</span><span class="chip-name">Ариэль · ИИ</span><span class="chip-lives">21<small>/30</small></span></div>
          <div class="chip-hp"><span class="chip-hp-fill" style="width:70%"></span></div>
          <div class="chip-foot"><span class="chip-streak"><b>4</b><s></s><s></s><s></s><s></s></span><span class="chip-meta">ур. 4</span></div>
        </div>
        <div class="player-chip has-streak streak-blaze next-opponent" style="--streak:6">
          <span class="streak-flare"><i></i><i></i><i></i><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><s></s><s></s><s></s><s></s></span>
          <div class="chip-head"><span class="chip-rank">3</span><span class="chip-name">Кровавый лорд</span><span class="chip-lives">14<small>/30</small></span></div>
          <div class="chip-hp"><span class="chip-hp-fill" style="width:46.6%"></span></div>
          <div class="chip-foot"><span class="chip-streak"><b>6</b><s></s><s></s><s></s><s></s></span><span class="chip-opponent">соперник</span><span class="chip-meta">ур. 6</span></div>
        </div>
        <div class="player-chip has-streak streak-inferno" style="--streak:8">
          <span class="streak-flare"><i></i><i></i><i></i><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><s></s><s></s><s></s><s></s></span>
          <div class="chip-head"><span class="chip-rank">4</span><span class="chip-name">Пепельный</span><span class="chip-lives">7<small>/30</small></span></div>
          <div class="chip-hp"><span class="chip-hp-fill" style="width:23.3%"></span></div>
          <div class="chip-foot"><span class="chip-streak"><b>8</b><s></s><s></s><s></s><s></s></span><span class="chip-meta">ур. 7</span></div>
        </div>
        <div class="player-chip hp-low" style="--streak:0">
          <div class="chip-head"><span class="chip-rank">5</span><span class="chip-name">Тень</span><span class="chip-lives">3<small>/30</small></span></div>
          <div class="chip-hp"><span class="chip-hp-fill" style="width:10%"></span></div>
          <div class="chip-foot"><span class="chip-streak loss"><b>−2</b><s></s><s></s><s></s><s></s></span><span class="chip-meta">ур. 3</span></div>
        </div>
      </div>
    </div></div>
  </body>
</html>
